<tbody>${invoiceRows.map(i=>`<tr><td class="c-item">${i.item}</td><td class="c-qty">${i.qty}</td><td><b>${aeEscDoc(i.name)}</b><br><span class="ae-smaller">SKU ${aeEscDoc(i.sku)} · ${aeEscDoc(i.size)} · ${aeEscDoc(i.color)}</span></td><td class="c-count">${i.unitCount}</td><td class="c-price">${aeDocMoney(i.price)}</td><td class="c-total">${aeDocMoney(i.price*i.qty)}</td></tr>`).join('')}<tr class="total-row"><td colspan="5" style="text-align:right">Total</td><td class="c-total">${aeDocMoney(m.total)}</td></tr></tbody></table><table class="ae-footer-grid"><tr><td class="ae-notes"><b>Note / Comments:</b><br>${aeEscDoc(m.notes||'Order generated automatically from AEHRAN Admin.')}</td><td><table class="ae-sign-table"><tr><td><b>Date:</b> ${aeEscDoc(aeDocDate(m.date))}</td><td><b>Approver’s Signature:</b></td></tr><tr><td colspan="2"><b>Purchaser:</b> ${aeEscDoc(m.name)}</td></tr><tr><td colspan="2"><b>Title:</b> Customer Order / Invoice</td></tr></table></td></tr></table><div class="ae-brand-foot">AEHRAN · THE ROYAL OF ETHNIC</div></section></div>`;document.body.appendChild(stage);return {stage,sheet:stage.querySelector('#aeA4Sheet'),model:m}}
function aeRenderOrderCodes(pack){const m=pack.model,qrEl=pack.stage.querySelector('#aeOrderQR'),bar=pack.stage.querySelector('#aeTrackingBarcode');if(typeof QRCode==='function'){new QRCode(qrEl,{text:JSON.stringify({order_id:m.id,tracking_id:m.tracking,awb:m.awb,phone:m.phone,total:m.total}),width:180,height:180,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}else qrEl.innerHTML='<div style="font-size:8px;text-align:center">QR library unavailable</div>';if(typeof JsBarcode==='function'){try{JsBarcode(bar,m.tracking,{format:'CODE128',displayValue:false,margin:0,height:44,width:1.6,lineColor:'#000'})}catch(e){bar.outerHTML='<div>'+aeEscDoc(m.tracking)+'</div>'}}}
function aeWait(ms=70){return new Promise(r=>setTimeout(r,ms))}
async function downloadOrderPack(id){const o=orders.find(x=>String(x.id)===String(id));if(!o){toast('Order not found');return}if(typeof html2pdf!=='function'){toast('PDF library is still loading. Check internet and try again.');return}const pack=aeBuildOrderPack(o);aeRenderOrderCodes(pack);await aeWait(140);const filename='AEHRAN_Label_Invoice_'+String(o.id||'Order').replace(/[^a-z0-9_-]/gi,'_')+'.pdf';try{await html2pdf().set({margin:[5,5,5,5],filename,image:{type:'jpeg',quality:.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(pack.sheet).save();toast('A4 Label + Order Form PDF downloaded')}catch(e){console.error(e);toast('Could not generate combined PDF')}finally{pack.stage.remove()}}
async function printOrderPack(id){const o=orders.find(x=>String(x.id)===String(id));if(!o){toast('Order not found');return}const pack=aeBuildOrderPack(o);aeRenderOrderCodes(pack);await aeWait(140);const qr=pack.stage.querySelector('#aeOrderQR canvas');if(qr){const img=document.createElement('img');img.src=qr.toDataURL('image/png');img.style.width='31mm';img.style.height='31mm';pack.stage.querySelector('#aeOrderQR').innerHTML='';pack.stage.querySelector('#aeOrderQR').appendChild(img)}const host=document.createElement('div');host.id='aePrintHost';host.appendChild(pack.sheet.cloneNode(true));document.body.appendChild(host);pack.stage.remove();document.body.classList.add('ae-printing');setTimeout(()=>{window.print();setTimeout(()=>{document.body.classList.remove('ae-printing');host.remove()},400)},120)}
async function previewOrderPack(id){const o=orders.find(x=>String(x.id)===String(id));if(!o)return;document.getElementById('aePackPreview')?.remove();const pack=aeBuildOrderPack(o);aeRenderOrderCodes(pack);await aeWait(100);const wrap=document.createElement('div');wrap.className='ae-preview-wrap';wrap.id='aePackPreview';pack.sheet.style.transform='none';const card=document.createElement('div');card.className='ae-preview-card';card.innerHTML=`<div class="ae-preview-toolbar"><button class="btn small gold" id="aePrevDownload">Download PDF & Label</button><button class="btn ghost small" id="aePrevPrint">Print A4</button><button class="btn danger small" id="aePrevClose">Close</button></div>`;card.appendChild(pack.sheet);wrap.appendChild(card);document.body.appendChild(wrap);pack.stage.remove();card.querySelector('#aePrevDownload').onclick=()=>downloadOrderPack(id);card.querySelector('#aePrevPrint').onclick=()=>printOrderPack(id);card.querySelector('#aePrevClose').onclick=()=>wrap.remove()}

function exportOrders(){const rows=[['Order ID','Date','Name','Email','Phone','Total','Payment','Status','Address'],...orders.map(o=>[o.id,o.date,o.name,o.email,o.phone,o.total,o.payment,o.status,o.address])];downloadBlob('aehran-orders.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}

function azControlPage(){return `${head('A–Z Store Control','Every important storefront control is grouped here so you can jump straight to the section you need.')}
<div class="az-grid">
${[
 ['Products','Add/edit/delete products, price, MRP, stock, audience, type, images, galleries, variants and tags.','products'],
 ['Category Control','Control Men, Kids, Kids Kurta, Men Jackets, Kids Jackets, Wedding and other collection placement.','categoryControl'],
 ['Banner Slider','Change all 3 hero banners, their links, labels, order and auto-slide timing.','banners'],
 ['Homepage','Edit category circles, trending text, editorials, occasions, service strip, films and reviews.','homepage'],
 ['Navigation','Rename/reorder/show/hide New, Men, Kids, Jackets, Wedding, Collections and Sale menu items.','navigation'],
 ['Image Display','Control product image framing, face focus, gallery fit and banner fit.','display'],
 ['Orders & Returns','Manage order status, return/exchange requests, pickup and refund workflow.','orders'],
 ['Payments','Review payment methods and settlement status.','payments'],
 ['Branding','Logo, wordmark, tagline and website colour palette.','branding'],
 ['Policies','Shipping, returns, privacy, terms and size guide content.','policies'],
 ['SEO & Footer','Meta title/description, footer, newsletter, contact and Instagram.','footer'],

].map(x=>`<div class="az-card"><b>${x[0]}</b><p>${x[1]}</p><button class="btn ghost small" onclick="show('${x[2]}')">Open control →</button></div>`).join('')}
</div><div class="section-card" style="margin-top:16px"><h2>Current storefront structure</h2><p><span class="help-chip">Kids Kurta Sets</span><span class="help-chip">Men's Jackets</span><span class="help-chip">Kids' Jackets</span><span class="help-chip">Wedding</span><span class="help-chip">3 Banner Slider</span><span class="help-chip">Multi-angle Galleries</span><span class="help-chip">Colour Variants</span><span class="help-chip">Returns</span></p><div class="control-note">All catalogue and CMS changes are saved to the same <span class="kbd">aehran_products</span> and <span class="kbd">aehran_cms</span> data keys used by the storefront bridge.</div></div>`}

const CATEGORY_MATRIX=[['new','New'],['men','Men'],['kids','Kids'],['kurta','Kurta'],['kids-kurta','Kids Kurta'],['jacket','Jackets'],['men-jacket','Men Jackets'],['kids-jacket','Kids Jackets'],['wedding','Wedding'],['sherwani','Sherwani'],['festive','Festive'],['sale','Sale'],['ready','Ready']];
function categoryControlPage(){return `${head('Category Control','Place each product exactly where it should appear. Kids Kurta, Men Jackets, Kids Jackets and Wedding are separated.',`<button class="btn ghost" onclick="applySmartCategoryRules()">Smart organize</button><button class="btn" onclick="saveCategoryMatrix()">Save categories</button>`)}<div class="section-card"><h2>Client category rules</h2><p>Kids Kurta = kids only. Jacket menu = separate Men and Kids collections. Wedding can contain dedicated men and kids wedding items.</p><div class="control-note">Tip: use Smart organize after adding products. You can still change any checkbox manually before saving.</div></div><div class="table-wrap matrix-wrap"><table class="matrix"><thead><tr><th>Product</th>${CATEGORY_MATRIX.map(x=>`<th>${x[1]}</th>`).join('')}</tr></thead><tbody>${products.map((p,pi)=>`<tr><td><div class="product-cell"><img class="thumb" src="${attr(p.img)}"><div><b>${esc(p.name)}</b><br><small>${esc(p.audience||'')} · ${esc(p.productType||p.cat)}</small></div></div></td>${CATEGORY_MATRIX.map(x=>`<td><input class="tiny-toggle" type="checkbox" data-prod="${attr(p.id)}" data-col="${x[0]}" ${(p.collections||[]).includes(x[0])||p.cat===x[0]?'checked':''}></td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function saveCategoryMatrix(){products.forEach(p=>{const checks=[...document.querySelectorAll(`input[data-prod="${CSS.escape(p.id)}"]`)];if(!checks.length)return;const controlled=CATEGORY_MATRIX.map(x=>x[0]);p.collections=(p.collections||[]).filter(c=>!controlled.includes(c));checks.filter(c=>c.checked).forEach(c=>p.collections.push(c.dataset.col));p.collections=[...new Set(p.collections)]});commit('Category placement updated');show('categoryControl')}
function applySmartCategoryRules(){products.forEach(p=>{let c=new Set(p.collections||[]);if(p.audience==='kids'){c.add('kids');c.delete('men');if(String(p.productType||'').includes('jacket')){c.add('jacket');c.add('kids-jacket');c.delete('men-jacket')}if(String(p.productType||'').includes('kurta')&&!String(p.productType||'').includes('jacket')){c.add('kurta');c.add('kids-kurta')}}else{c.add('men');if(String(p.productType||'').includes('jacket')){c.add('jacket');c.add('men-jacket');c.delete('kids-jacket')}}if(c.has('kids-kurta')&&p.audience!=='kids')c.delete('kids-kurta');p.collections=[...c]});commit('Smart category rules applied');show('categoryControl')}

function ensureHeroSlides(){cms.hero=cms.hero||{};if(!Array.isArray(cms.hero.slides))cms.hero.slides=[];while(cms.hero.slides.length<3)cms.hero.slides.push({image:cms.hero.slides.length===0?LATEST_BANNER_KIDS:cms.hero.slides.length===1?LATEST_BANNER_WHITE:BUILTIN_HERO,link:cms.hero.slides.length===0?'kids':'new',label:'Banner '+(cms.hero.slides.length+1),active:true});return cms.hero.slides}
function bannersPage(){const slides=ensureHeroSlides();return `${head('Banner Slider','Control all hero banners from admin — image, destination, label, order and autoplay.',`<button class="btn ghost" onclick="addBanner()">+ Add slide</button><button class="btn" onclick="saveBanners()">Save slider</button>`)}<div class="section-card"><div class="split3"><div class="field"><label>Auto slide timing (seconds)</label><input id="bannerSeconds" type="number" min="1" max="20" step="1" value="${Math.max(1,Math.round(Number(cms.hero.autoplayMs||3000)/1000))}"></div><div class="field"><label>Banner fit</label><select id="bannerFit"><option value="cover" ${(cms.display?.bannerFit||'cover')==='cover'?'selected':''}>Cover</option><option value="contain" ${cms.display?.bannerFit==='contain'?'selected':''}>Contain</option></select></div><div class="field"><label>Slides</label><input disabled value="${slides.length} active/editable slots"></div></div><p class="mini-note">The current store is set for a 3-second automatic slider. You can change it here.</p></div><div class="banner-admin-grid">${slides.map((s,i)=>bannerAdminCard(s,i)).join('')}</div>`}
function bannerAdminCard(s,i){return `<div class="banner-admin-card"><div class="banner-preview" id="bannerPreview${i}">${s.image?`<img src="${attr(s.image)}">`:''}</div><div><div class="form-grid"><div class="field wide"><label>Banner ${i+1} image</label><input id="bannerImage${i}" value="${attr(s.image||'')}" oninput="bannerPreview(${i})"><div class="banner-actions"><button type="button" class="btn ghost small" onclick="pickMedia('bannerImage${i}')">Media library</button><label class="btn alt small">Upload banner<input hidden type="file" accept="image/*" onchange="uploadToInput(this,'bannerImage${i}',2000);setTimeout(()=>bannerPreview(${i}),30)"></label></div></div><div class="field"><label>Label / accessibility title</label><input id="bannerLabel${i}" value="${attr(s.label||'Banner '+(i+1))}"></div><div class="field"><label>Click destination</label><select id="bannerLink${i}">${COLLECTIONS.map(x=>`<option value="${x[0]}" ${x[0]===(s.link||'new')?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="bannerActive${i}"><option value="1" ${s.active!==false?'selected':''}>Active</option><option value="0" ${s.active===false?'selected':''}>Hidden</option></select></div></div><div class="banner-actions"><button class="btn ghost small" onclick="moveBanner(${i},-1)">↑ Move up</button><button class="btn ghost small" onclick="moveBanner(${i},1)">↓ Move down</button>${ensureHeroSlides().length>1?`<button class="btn danger small" onclick="removeBanner(${i})">Remove</button>`:''}</div></div></div>`}
function bannerPreview(i){const box=document.getElementById('bannerPreview'+i),v=document.getElementById('bannerImage'+i)?.value||'';if(box)box.innerHTML=v?`<img src="${attr(v)}">`:''}
function collectBannerForm(){const slides=ensureHeroSlides();return slides.map((s,i)=>({image:document.getElementById('bannerImage'+i)?.value.trim()||s.image,link:document.getElementById('bannerLink'+i)?.value||s.link||'new',label:document.getElementById('bannerLabel'+i)?.value.trim()||('Banner '+(i+1)),active:(document.getElementById('bannerActive'+i)?.value||'1')==='1'}))}
function saveBanners(){const slides=collectBannerForm();cms.hero.slides=slides;const active=slides.find(x=>x.active!==false&&x.image)||slides[0];cms.hero.image=active?.image||'';cms.hero.link=active?.link||'new';cms.hero.autoplayMs=Math.max(1000,Number(document.getElementById('bannerSeconds')?.value||3)*1000);cms.display=cms.display||{};cms.display.bannerFit=document.getElementById('bannerFit')?.value||'cover';commit('Banner slider updated')}
function moveBanner(i,d){cms.hero.slides=collectBannerForm();const j=i+d;if(j<0||j>=cms.hero.slides.length)return;[cms.hero.slides[i],cms.hero.slides[j]]=[cms.hero.slides[j],cms.hero.slides[i]];commit('Banner order updated');show('banners')}
function removeBanner(i){cms.hero.slides=collectBannerForm();cms.hero.slides.splice(i,1);commit('Banner removed');show('banners')}
function addBanner(){cms.hero.slides=collectBannerForm();cms.hero.slides.push({image:'',link:'new',label:'New banner',active:true});commit('Banner slot added');show('banners')}

function displayPage(){const d=cms.display||clone(DEFAULT_CMS.display);return `${head('Image Display','Control product framing so faces are not cut and product galleries stay clean.',`<button class="btn" onclick="saveDisplay()">Save display</button>`)}<div class="grid2"><div class="section-card"><h2>Product cards</h2><div class="field"><label>Image fit</label><select id="displayProductFit"><option value="cover" ${d.productFit==='cover'?'selected':''}>Cover</option><option value="contain" ${d.productFit==='contain'?'selected':''}>Contain</option></select></div><div class="field"><label>Vertical focus (%)</label><input id="displayProductY" type="range" min="0" max="100" value="${Number(d.productPositionY||7)}" oninput="document.getElementById('displayYValue').textContent=this.value+'%'"><small id="displayYValue">${Number(d.productPositionY||7)}%</small></div><p class="mini-note">Lower values keep the model's head nearer the top of the frame. Current recommended value: 7%.</p></div><div class="section-card"><h2>Product detail gallery</h2><div class="field"><label>Gallery fit</label><select id="displayGalleryFit"><option value="contain" ${d.galleryFit==='contain'?'selected':''}>Contain / full outfit</option><option value="cover" ${d.galleryFit==='cover'?'selected':''}>Cover</option></select></div><div class="field"><label>Banner fit</label><select id="displayBannerFit"><option value="cover" ${d.bannerFit==='cover'?'selected':''}>Cover</option><option value="contain" ${d.bannerFit==='contain'?'selected':''}>Contain</option></select></div></div></div>`}
function saveDisplay(){cms.display={productFit:document.getElementById('displayProductFit').value,productPositionY:Number(document.getElementById('displayProductY').value),galleryFit:document.getElementById('displayGalleryFit').value,bannerFit:document.getElementById('displayBannerFit').value};commit('Image display settings updated')}

function collectionsPage(){return `${head('Collections','Each category has its own product workspace, exactly separated for easy uploading.',`<button class="btn" onclick="openProduct()">+ Add product</button>`)}<div class="collection-grid">${COLLECTIONS.map(([s,n])=>{const c=products.filter(p=>(p.collections||[]).includes(s)||p.cat===s).length;return `<div class="collection-card" onclick="renderCollectionDetail('${s}')"><b>${n}</b><strong>${c}</strong><span>products · open category →</span></div>`}).join('')}</div>`}
function renderCollectionDetail(slugv){collectionCtx=slugv;current='collectionDetail';const c=document.getElementById('content');const name=COLLECTIONS.find(x=>x[0]===slugv)?.[1]||slugv;const list=products.filter(p=>(p.collections||[]).includes(slugv)||p.cat===slugv);c.innerHTML=`${head(name,'Upload and manage products only for this collection.',`<button class="btn ghost" onclick="show('collections')">← All collections</button><button class="btn" onclick="openProduct('', '${slugv}')">+ Add to ${name}</button>`)}${productTable(list)}`;document.getElementById('crumb').textContent='Collections / '+name}
function productsPage(){return `${head('All Products','Edit pricing, stock, images, product text and collection placement.',`<button class="btn" onclick="openProduct()">+ Add product</button>`)}<div class="search-row"><input id="prodSearch" class="input" placeholder="Search products..." oninput="renderProductSearch()"><select id="prodCat" onchange="renderProductSearch()"><option value="">All categories</option>${COLLECTIONS.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select></div><div id="productTable">${productTable(products)}</div>`}
function productTable(list){return `<div class="table-wrap"><table><thead><tr><th>Product</th><th>Primary</th><th>Collections</th><th>Price</th><th>Stock</th><th>Rating</th><th></th></tr></thead><tbody>${list.map(p=>`<tr><td><div class="product-cell"><img class="thumb" src="${attr(p.img)}"><div><b>${esc(p.name)}</b><br><small>${esc(p.sku||p.id)}</small></div></div></td><td>${esc(p.cat)}</td><td><small>${(p.collections||[]).slice(0,4).map(esc).join(', ')}${(p.collections||[]).length>4?'…':''}</small></td><td>${money(p.price)}<br><small><s>${money(p.old)}</s></small></td><td><b>${p.stock}</b></td><td>★ ${p.rating||0}</td><td><button class="btn ghost small" onclick="openProduct('${p.id}')">Edit</button></td></tr>`).join('')||`<tr><td colspan="7"><div class="empty">No products in this category yet.</div></td></tr>`}</tbody></table></div>`}
function renderProductSearch(){const q=(document.getElementById('prodSearch')?.value||'').toLowerCase(),cat=document.getElementById('prodCat')?.value||'';const list=products.filter(p=>(!cat||(p.collections||[]).includes(cat)||p.cat===cat)&&(p.name+' '+p.sku+' '+p.cat+' '+p.tag).toLowerCase().includes(q));document.getElementById('productTable').innerHTML=productTable(list)}
function openProduct(id='',preset=''){const p=id?products.find(x=>x.id===id):null;const d=p||{id:'',name:'',sku:'',cat:preset||'kurta',collections:preset?[preset]:[],audience:preset&&preset.startsWith('kids')?'kids':'men',productType:preset==='kids-jacket'||preset==='men-jacket'||preset==='jacket'?'nehru-jacket-set':preset==='sherwani'?'sherwani':'kurta-set',price:'',old:'',stock:10,color:'Ivory',tag:'New',tags:[],rating:4.8,reviews:0,img:'',imgs:[],desc:'',galleryType:'multi-angle',variantGroup:'',colorVariants:[]};openModal(`<div class="modal-head"><div><div class="label">${p?'EDIT PRODUCT':'NEW PRODUCT'}</div><h2>${p?esc(p.name):'Create product'}</h2></div><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="saveProduct(event,'${p?.id||''}')"><div class="form-grid"><div class="field"><label>Product name</label><input id="pName" value="${attr(d.name)}" required></div><div class="field"><label>SKU</label><input id="pSku" value="${attr(d.sku||'')}" placeholder="AHR-001"></div><div class="field"><label>Audience</label><select id="pAudience"><option value="men" ${d.audience==='men'?'selected':''}>Men</option><option value="kids" ${d.audience==='kids'?'selected':''}>Kids</option><option value="unisex" ${d.audience==='unisex'?'selected':''}>Unisex</option></select></div><div class="field"><label>Product type</label><select id="pType"><option value="kurta-set" ${d.productType==='kurta-set'?'selected':''}>Kurta Set</option><option value="nehru-jacket-set" ${d.productType==='nehru-jacket-set'?'selected':''}>Nehru Jacket Set</option><option value="sherwani" ${d.productType==='sherwani'?'selected':''}>Sherwani</option><option value="bandhgala" ${d.productType==='bandhgala'?'selected':''}>Bandhgala</option><option value="indowestern" ${d.productType==='indowestern'?'selected':''}>Indo-Western</option><option value="ethnic-set" ${!['kurta-set','nehru-jacket-set','sherwani','bandhgala','indowestern'].includes(d.productType)?'selected':''}>Other Ethnic Set</option></select></div><div class="field"><label>Primary category</label><select id="pCat">${COLLECTIONS.filter(x=>!['new','men','kids','ready','groom','groomsman','father','brother','reception','festive','sale'].includes(x[0])).map(x=>`<option value="${x[0]}" ${x[0]===d.cat?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="field"><label>Badge / tag</label><input id="pTag" value="${attr(d.tag||'')}"></div><div class="field"><label>Selling price (₹)</label><input id="pPrice" type="number" min="0" value="${d.price}" required></div><div class="field"><label>MRP (₹)</label><input id="pOld" type="number" min="0" value="${d.old}" required></div><div class="field"><label>Stock</label><input id="pStock" type="number" min="0" value="${d.stock}" required></div><div class="field"><label>Colour</label><input id="pColor" value="${attr(d.color||'')}"></div><div class="field"><label>Rating</label><input id="pRating" type="number" min="0" max="5" step="0.1" value="${d.rating||4.8}"></div><div class="field"><label>Review count</label><input id="pReviews" type="number" min="0" value="${d.reviews||0}"></div><div class="field"><label>Gallery type</label><select id="pGalleryType"><option value="multi-angle" ${d.galleryType==='multi-angle'?'selected':''}>Multi-angle</option><option value="single" ${d.galleryType==='single'?'selected':''}>Single image</option></select></div><div class="field"><label>Variant group</label><input id="pVariantGroup" value="${attr(d.variantGroup||'')}" placeholder="e.g. kids-royal-buta"></div><div class="field wide"><label>Search / style tags (comma separated)</label><input id="pTags" value="${attr((d.tags||[]).join(', '))}" placeholder="Kids, Wedding, Brocade, Nehru Jacket"></div><div class="field wide"><label>Collections</label><div class="checks">${COLLECTIONS.map(x=>`<label class="check"><input type="checkbox" name="pCollection" value="${x[0]}" ${(d.collections||[]).includes(x[0])?'checked':''}> ${x[1]}</label>`).join('')}</div><p class="mini-note">Use Kids Kurta Sets only for kids. Use Men's Jackets / Kids' Jackets to keep jacket menus separate. Wedding can be selected independently.</p></div><div class="field wide"><label>Description</label><textarea id="pDesc" rows="4">${esc(d.desc||'')}</textarea></div><div class="field wide"><label>Primary image URL</label><div style="display:flex;gap:7px"><input id="pImg" value="${attr(d.img||'')}" oninput="previewProductImage()"><button type="button" class="btn ghost small" onclick="pickMedia('pImg')">Library</button></div><input type="file" accept="image/*" onchange="uploadToInput(this,'pImg',1400)" style="margin-top:7px"></div><div class="field wide"><label>Gallery image URLs · one per line</label><textarea id="pImgs" rows="5">${esc((d.imgs||[]).join('\n'))}</textarea><input type="file" accept="image/*" multiple onchange="uploadGallery(this)" style="margin-top:7px"></div><div class="field wide"><label>Colour variants JSON</label><textarea id="pVariants" rows="5" placeholder='[{"id":"product-red","color":"Crimson Red","hex":"#8f1f24"}]'>${esc(JSON.stringify(d.colorVariants||[],null,2))}</textarea><p class="mini-note">Link different colours of the same outfit here. Leave [] when there are no colour variants.</p></div><div class="wide preview" id="pPreview">${d.img?`<img src="${attr(d.img)}">`:'<span class="mini-note">Product preview</span>'}</div></div><div class="head-actions" style="margin-top:18px"><button class="btn" type="submit">${p?'Save product':'Publish product'}</button>${p?`<button type="button" class="btn danger" onclick="deleteProduct('${p.id}')">Delete product</button>`:''}</div></form>`)}
function previewProductImage(){const v=document.getElementById('pImg').value,box=document.getElementById('pPreview');box.innerHTML=v?`<img src="${attr(v)}">`:'<span class="mini-note">Product preview</span>'}
function saveProduct(e,id){e.preventDefault();let variants=[];try{variants=JSON.parse(document.getElementById('pVariants').value||'[]');if(!Array.isArray(variants))throw 0}catch(_){return toast('Colour variants JSON is invalid')}const obj={id:id||'product-'+Date.now(),name:document.getElementById('pName').value.trim(),sku:document.getElementById('pSku').value.trim()||'AHR-'+Date.now().toString().slice(-7),cat:document.getElementById('pCat').value,audience:document.getElementById('pAudience').value,productType:document.getElementById('pType').value,collections:[...document.querySelectorAll('input[name=pCollection]:checked')].map(x=>x.value),price:Number(document.getElementById('pPrice').value),old:Number(document.getElementById('pOld').value),stock:Number(document.getElementById('pStock').value),color:document.getElementById('pColor').value.trim(),tag:document.getElementById('pTag').value.trim()||'New',tags:parseMulti(document.getElementById('pTags').value),rating:Number(document.getElementById('pRating').value)||0,reviews:Number(document.getElementById('pReviews').value)||0,img:document.getElementById('pImg').value.trim(),imgs:document.getElementById('pImgs').value.split(/\n+/).map(x=>x.trim()).filter(Boolean),desc:document.getElementById('pDesc').value.trim(),galleryType:document.getElementById('pGalleryType').value,variantGroup:document.getElementById('pVariantGroup').value.trim(),colorVariants:variants};if(!obj.collections.includes(obj.cat))obj.collections.push(obj.cat);if(obj.audience==='kids'&&!obj.collections.includes('kids'))obj.collections.push('kids');if(obj.audience==='men'&&!obj.collections.includes('men'))obj.collections.push('men');if(obj.productType.includes('jacket')){if(!obj.collections.includes('jacket'))obj.collections.push('jacket');const jc=obj.audience==='kids'?'kids-jacket':'men-jacket';if(!obj.collections.includes(jc))obj.collections.push(jc)}if(obj.audience==='kids'&&obj.productType==='kurta-set'&&!obj.collections.includes('kids-kurta'))obj.collections.push('kids-kurta');if(!obj.imgs.length&&obj.img)obj.imgs=[obj.img];if(obj.img&&!obj.imgs.includes(obj.img))obj.imgs.unshift(obj.img);if(!obj.img){toast('Please add a primary product image');return}const i=products.findIndex(x=>x.id===obj.id);if(i>=0)products[i]=obj;else products.unshift(obj);commit(i>=0?'Product updated':'Product published');closeModal();if(collectionCtx&&current==='collectionDetail')renderCollectionDetail(collectionCtx);else show('products')}
function deleteProduct(id){if(!confirm('Delete this product from the AEHRAN catalogue?'))return;products=products.filter(x=>x.id!==id);commit('Product deleted');closeModal();show('products')}
function mediaPage(){const all=getMedia();return `${head('Media Library','All product photos used on the website plus assets you upload here.',`<button class="btn" onclick="mediaUploadDialog()">+ Upload image</button><button class="btn ghost" onclick="addMediaUrl()">Add URL</button>`)}<div class="media-grid">${all.map((m,i)=>`<div class="media-card"><img src="${attr(m.url)}" loading="lazy"><div class="media-meta"><b>${esc(m.name||'AEHRAN image')}</b><small style="font-size:8px;color:var(--muted)">${esc(m.source)}</small><div class="media-actions"><button onclick="copyText('${i}')">Copy URL</button>${m.custom?`<button onclick="removeMedia('${attr(m.url)}')">Remove</button>`:''}</div></div></div>`).join('')}</div>`}
function getMedia(){const map=new Map();const add=(url,name,source,custom=false)=>{if(url&&!map.has(url))map.set(url,{url,name,source,custom})};products.forEach(p=>{add(p.img,p.name,'Product');(p.imgs||[]).forEach((u,i)=>add(u,p.name+' '+(i+1),'Gallery'))});add(cms.branding.logo,'Header logo','Branding');add(cms.branding.footerLogo,'Footer logo','Branding');add(cms.hero.image,'Hero banner','Homepage');(cms.hero?.slides||[]).forEach((x,i)=>add(x.image,'Hero slide '+(i+1),'Banner Slider'));(cms.home?.circles||[]).forEach(x=>add(x.image,x.label,'Circle'));(cms.home?.editorials||[]).forEach(x=>add(x.image,x.title,'Editorial'));(cms.home?.occasions||[]).forEach(x=>add(x.image,x.title,'Occasion'));(cms.home?.films||[]).forEach(x=>add(x.image,x.title,'Film'));media.forEach(x=>add(x.url,x.name||'Uploaded image','Uploaded',true));return [...map.values()]}
function mediaUploadDialog(){openModal(`<div class="modal-head"><div><div class="label">MEDIA</div><h2>Upload image</h2></div><button class="close" onclick="closeModal()">✕</button></div><div class="field"><label>Image file</label><input type="file" id="mediaFile" accept="image/*"></div><div class="field"><label>Name</label><input id="mediaName" placeholder="e.g. Wedding campaign 01"></div><button class="btn" onclick="saveMediaUpload()">Upload to library</button><p class="mini-note">Images are compressed and stored in browser storage in this demo. Cloud Storage can replace this when you provide the SDK.</p>`)}
async function saveMediaUpload(){const f=document.getElementById('mediaFile').files[0];if(!f)return toast('Choose an image first');const url=await fileToData(f,1400);media.unshift({url,name:document.getElementById('mediaName').value.trim()||f.name});commit('Image added to media library');closeModal();show('media')}
function addMediaUrl(){const url=prompt('Paste image URL');if(!url)return;media.unshift({url,name:'External image'});commit('Image URL added');show('media')}
function removeMedia(url){media=media.filter(x=>x.url!==url);commit('Media item removed');show('media')}
function copyText(i){const m=getMedia()[i];navigator.clipboard?.writeText(m.url);toast('Image URL copied')}
function pickMedia(target){document.getElementById('mediaPicker')?.remove();const all=getMedia(),wrap=document.createElement('div');wrap.id='mediaPicker';wrap.style.cssText='position:fixed;inset:0;z-index:160;background:rgba(5,12,19,.70);display:grid;place-items:center;padding:18px';wrap.innerHTML=`<div style="width:min(860px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;padding:18px;box-shadow:0 30px 100px rgba(0,0,0,.35)"><div class="modal-head"><div><div class="label">MEDIA LIBRARY</div><h2>Choose image</h2></div><button class="close" onclick="document.getElementById('mediaPicker').remove()">✕</button></div><div class="media-grid" style="grid-template-columns:repeat(4,1fr)">${all.map((m,i)=>`<button type="button" style="border:1px solid var(--line);background:#fff;border-radius:9px;overflow:hidden;padding:0" onclick="useMedia('${target}',${i})"><img src="${attr(m.url)}" style="aspect-ratio:1/1.1;object-fit:cover"><span style="display:block;padding:7px;font-size:8px">${esc(m.name)}</span></button>`).join('')}</div></div>`;document.body.appendChild(wrap)}

function useMedia(target,i){const m=getMedia()[i],el=document.getElementById(target);if(el){el.value=m.url;el.dispatchEvent(new Event('input'))}document.getElementById('mediaPicker')?.remove();toast('Image selected')}

async function uploadToInput(input,target,max=1400){const f=input.files?.[0];if(!f)return;const url=await fileToData(f,max);document.getElementById(target).value=url;document.getElementById(target).dispatchEvent(new Event('input'));media.unshift({url,name:f.name});save('aehran_media',media);toast('Image loaded')}
async function uploadGallery(input){const urls=[];for(const f of [...input.files])urls.push(await fileToData(f,1400));const t=document.getElementById('pImgs');t.value=[t.value,...urls].filter(Boolean).join('\n');urls.forEach((url,i)=>media.unshift({url,name:input.files[i].name}));save('aehran_media',media);toast(urls.length+' gallery image(s) added')}
function fileToData(file,max=1400){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*scale),h=Math.round(img.height*scale),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);res(c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.82))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function homepagePage(){const h=cms.home;return `${head('Homepage Editor','Change the hero, circles, text, editorial blocks, occasions, films and reviews.',`<button class="btn" onclick="saveHomepage()">Save homepage</button>`)}<div class="section-card"><h2>Hero banner / slider</h2><p>The storefront now supports multiple hero slides. Use Banner Slider for full control; this field controls the primary/fallback hero.</p><button class="btn ghost small" type="button" onclick="show('banners')">Open Banner Slider →</button><div class="form-grid"><div class="field"><label>Hero image</label><input id="heroImage" value="${attr(cms.hero.image)}"><div class="head-actions"><button class="btn ghost small" type="button" onclick="pickMedia('heroImage')">Choose library</button><label class="btn alt small">Upload<input type="file" hidden accept="image/*" onchange="uploadToInput(this,'heroImage',1800)"></label></div></div><div class="field"><label>Click goes to collection</label><select id="heroLink">${COLLECTIONS.map(x=>`<option value="${x[0]}" ${x[0]===cms.hero.link?'selected':''}>${x[1]}</option>`).join('')}</select></div></div></div><div class="section-card"><h2>Circle categories</h2><p>Separate category shortcuts shown under the hero.</p>${h.circles.map((x,i)=>`<div class="repeat-row"><input id="circleLabel${i}" value="${attr(x.label)}" placeholder="Label"><select id="circleTarget${i}">${COLLECTIONS.map(c=>`<option value="${c[0]}" ${c[0]===x.target?'selected':''}>${c[1]}</option>`).join('')}</select><input id="circleImage${i}" value="${attr(x.image||'')}" placeholder="Optional image URL (falls back to product)"><button class="btn ghost small" onclick="pickMedia('circleImage${i}')">Image</button></div>`).join('')}</div><div class="section-card"><h2>Trending Styles</h2><div class="form-grid"><div class="field"><label>Eyebrow</label><input id="trendEye" value="${attr(h.trending.eyebrow)}"></div><div class="field"><label>Heading</label><input id="trendTitle" value="${attr(h.trending.title)}"></div><div class="field wide"><label>Description</label><textarea id="trendDesc">${esc(h.trending.description)}</textarea></div></div></div>${arrayEditor('editorials','Editorial blocks',h.editorials,['eyebrow','title','target','image'])}${arrayEditor('occasions','Shop by Occasion',h.occasions,['title','subtitle','target','image'])}${arrayEditor('films','Film / video-style blocks',h.films,['kicker','title','text','productId','image'])}<div class="section-card"><h2>Service strip</h2><div class="form-grid"><div class="field"><label>Eyebrow</label><input id="serviceEye" value="${attr(h.service.eyebrow)}"></div><div class="field"><label>Heading</label><input id="serviceTitle" value="${attr(h.service.title)}"></div></div>${h.service.items.map((x,i)=>`<div class="repeat-row" style="grid-template-columns:1fr 2fr"><input id="serviceT${i}" value="${attr(x.title)}"><input id="serviceX${i}" value="${attr(x.text)}"></div>`).join('')}</div><div class="section-card"><h2>Homepage review cards</h2><div class="form-grid"><div class="field"><label>Eyebrow</label><input id="reviewEye" value="${attr(h.reviews.eyebrow)}"></div><div class="field"><label>Heading</label><input id="reviewTitle" value="${attr(h.reviews.title)}"></div></div>${h.reviews.items.map((x,i)=>`<div class="repeat-row" style="grid-template-columns:2fr 1fr"><textarea id="revText${i}" rows="2">${esc(x.text)}</textarea><input id="revBy${i}" value="${attr(x.by)}"></div>`).join('')}</div>`}
function arrayEditor(key,title,arr,fields){return `<div class="section-card"><h2>${title}</h2><p>Edit every card independently.</p>${arr.map((x,i)=>`<div style="border-top:1px solid #edf0f2;padding:13px 0"><b style="font-size:10px">Block ${i+1}</b><div class="form-grid" style="margin-top:8px">${fields.map(f=>`<div class="field ${f==='image'?'wide':''}"><label>${f}</label>${f==='target'?`<select id="${key}_${f}_${i}">${COLLECTIONS.map(c=>`<option value="${c[0]}" ${c[0]===x[f]?'selected':''}>${c[1]}</option>`).join('')}</select>`:`<div style="display:flex;gap:6px"><input id="${key}_${f}_${i}" value="${attr(x[f]||'')}">${f==='image'?`<button class="btn ghost small" type="button" onclick="pickMedia('${key}_${f}_${i}')">Library</button>`:''}</div>`}</div>`).join('')}</div></div>`).join('')}</div>`}
function saveHomepage(){cms.hero.image=document.getElementById('heroImage').value;cms.hero.link=document.getElementById('heroLink').value;if(Array.isArray(cms.hero.slides)&&cms.hero.slides[0]){cms.hero.slides[0].image=cms.hero.image;cms.hero.slides[0].link=cms.hero.link;}cms.home.circles.forEach((x,i)=>{x.label=document.getElementById('circleLabel'+i).value;x.target=document.getElementById('circleTarget'+i).value;x.image=document.getElementById('circleImage'+i).value});cms.home.trending={eyebrow:document.getElementById('trendEye').value,title:document.getElementById('trendTitle').value,description:document.getElementById('trendDesc').value};['editorials','occasions','films'].forEach(k=>cms.home[k].forEach((x,i)=>Object.keys(x).forEach(f=>{const el=document.getElementById(`${k}_${f}_${i}`);if(el)x[f]=el.value})));cms.home.service.eyebrow=document.getElementById('serviceEye').value;cms.home.service.title=document.getElementById('serviceTitle').value;cms.home.service.items.forEach((x,i)=>{x.title=document.getElementById('serviceT'+i).value;x.text=document.getElementById('serviceX'+i).value});cms.home.reviews.eyebrow=document.getElementById('reviewEye').value;cms.home.reviews.title=document.getElementById('reviewTitle').value;cms.home.reviews.items.forEach((x,i)=>{x.text=document.getElementById('revText'+i).value;x.by=document.getElementById('revBy'+i).value});commit('Homepage updated')}
function navigationPage(){return `${head('Navigation','Rename, reorder and show/hide the main storefront navigation.',`<button class="btn" onclick="saveNav()">Save navigation</button>`)}<div class="section-card">${cms.nav.map((x,i)=>`<div class="repeat-row"><input id="navLabel${i}" value="${attr(x.label)}"><select id="navTarget${i}"><option value="home" ${x.target==='home'?'selected':''}>Home</option>${COLLECTIONS.map(c=>`<option value="${c[0]}" ${c[0]===x.target?'selected':''}>${c[1]}</option>`).join('')}</select><label class="check"><input id="navVisible${i}" type="checkbox" ${x.visible!==false?'checked':''}> Visible</label><div><button class="btn ghost small" onclick="moveNav(${i},-1)">↑</button> <button class="btn ghost small" onclick="moveNav(${i},1)">↓</button></div></div>`).join('')}</div>`}
function saveNav(){cms.nav.forEach((x,i)=>{x.label=document.getElementById('navLabel'+i).value;x.target=document.getElementById('navTarget'+i).value;x.visible=document.getElementById('navVisible'+i).checked});commit('Navigation updated')}
function moveNav(i,d){const j=i+d;if(j<0||j>=cms.nav.length)return;[cms.nav[i],cms.nav[j]]=[cms.nav[j],cms.nav[i]];commit('Navigation reordered');show('navigation')}
function brandingPage(){const b=cms.branding,t=cms.theme;return `${head('Branding & Theme','Control logo, brand text and the navy / cream / gold visual system.',`<button class="btn" onclick="saveBranding()">Save branding</button>`)}<div class="grid2"><div class="section-card"><h2>Brand identity</h2><div class="field"><label>Brand name</label><input id="brandName" value="${attr(b.brandName)}"></div><div class="field"><label>Tagline</label><input id="brandTag" value="${attr(b.tagline)}"></div><div class="field"><label>Header logo</label><input id="brandLogo" value="${attr(b.logo)}" oninput="brandPreview()"><div class="head-actions"><button class="btn ghost small" onclick="pickMedia('brandLogo')">Library</button><label class="btn alt small">Upload logo<input hidden type="file" accept="image/*" onchange="uploadToInput(this,'brandLogo',700)"></label></div></div><div class="preview" id="brandPreview"><img src="${attr(b.logo)}" style="max-height:180px;object-fit:contain"></div><div class="field"><label>Footer transparent logo</label><input id="footerLogo" value="${attr(b.footerLogo)}"><div class="head-actions"><button class="btn ghost small" onclick="pickMedia('footerLogo')">Library</button><label class="btn alt small">Upload PNG<input hidden type="file" accept="image/*" onchange="uploadToInput(this,'footerLogo',1000)"></label></div></div></div><div class="section-card"><h2>Theme palette</h2>${[['navy','Dark navy'],['navy2','Navy 2'],['navy3','Navy 3'],['cream','Cream'],['gold','Muted gold'],['background','Page background']].map(x=>`<div class="field"><label>${x[1]}</label><div class="color-field"><input id="color_${x[0]}" type="color" value="${t[x[0]]}"><input id="colorText_${x[0]}" value="${t[x[0]]}" oninput="document.getElementById('color_${x[0]}').value=this.value"></div></div>`).join('')}<button class="btn ghost small" onclick="resetTheme()">Reset premium palette</button></div></div>`}
function brandPreview(){document.getElementById('brandPreview').innerHTML=`<img src="${attr(document.getElementById('brandLogo').value)}" style="max-height:180px;object-fit:contain">`}
function saveBranding(){cms.branding.brandName=document.getElementById('brandName').value;cms.branding.tagline=document.getElementById('brandTag').value;cms.branding.logo=document.getElementById('brandLogo').value;cms.branding.footerLogo=document.getElementById('footerLogo').value;Object.keys(cms.theme).forEach(k=>{const el=document.getElementById('color_'+k);if(el)cms.theme[k]=el.value});commit('Branding and theme updated')}

function uniqueCustomers(){const m=new Map();orders.forEach(o=>{const k=(o.email||o.phone||o.name||'guest').toLowerCase();if(!m.has(k))m.set(k,{name:o.name,email:o.email,phone:o.phone,orders:0,spend:0,last:o.date});const c=m.get(k);c.orders++;c.spend+=Number(o.total||0);if(new Date(o.date)>new Date(c.last))c.last=o.date});const p=load('aehran_profile',null);if(p){const k=(p.email||p.phone||p.name||'profile').toLowerCase();if(!m.has(k))m.set(k,{name:p.name,email:p.email,phone:p.phone,orders:0,spend:0,last:null})}return [...m.values()]}

function returnsPage(){
 const pending=returnsDB.filter(r=>!['Refunded','Rejected'].includes(r.status)).length,refunded=returnsDB.filter(r=>r.status==='Refunded').reduce((a,r)=>a+Number(r.amount||0),0);
 return `${head('Returns','Track return, exchange and refund requests from one workspace.',`<button class="btn ghost" onclick="exportReturns()">Export CSV</button><button class="btn" onclick="openReturn()">+ New return</button>`)}
 <div class="cards"><div class="stat"><label>Total requests</label><strong>${returnsDB.length}</strong><small>All return cases</small></div><div class="stat"><label>Open cases</label><strong>${pending}</strong><small>Need action or pickup</small></div><div class="stat"><label>Refunded</label><strong>${returnsDB.filter(r=>r.status==='Refunded').length}</strong><small>Completed refunds</small></div><div class="stat"><label>Refund value</label><strong>${money(refunded)}</strong><small>Total marked refunded</small></div></div>
 <div class="search-row" style="margin-top:16px"><input class="input" id="returnSearch" placeholder="Search return, order, customer..." oninput="renderReturnsTable()"><select id="returnStatus" onchange="renderReturnsTable()"><option value="">All statuses</option>${['Requested','Approved','Pickup Scheduled','Received','Refunded','Rejected'].map(x=>`<option>${x}</option>`).join('')}</select></div>
 <div class="table-wrap"><table><thead><tr><th>Return</th><th>Order</th><th>Customer</th><th>Reason</th><th>Amount</th><th>Status</th><th>Requested</th><th></th></tr></thead><tbody id="returnsTbody"></tbody></table></div>`
}
function renderReturnsTable(){const tb=document.getElementById('returnsTbody');if(!tb)return;const q=(document.getElementById('returnSearch')?.value||'').toLowerCase(),st=document.getElementById('returnStatus')?.value||'';const list=returnsDB.slice().reverse().filter(r=>(!st||r.status===st)&&JSON.stringify(r).toLowerCase().includes(q));tb.innerHTML=list.map(r=>`<tr><td><b>${esc(r.id)}</b></td><td>${esc(r.orderId||'—')}</td><td><b>${esc(r.customer||'—')}</b><br><small>${esc(r.email||'')}</small></td><td style="max-width:260px">${esc(r.reason||'—')}</td><td><b>${money(r.amount)}</b></td><td><select onchange="setReturnStatus('${r.id}',this.value)">${['Requested','Approved','Pickup Scheduled','Received','Refunded','Rejected'].map(x=>`<option ${x===r.status?'selected':''}>${x}</option>`).join('')}</select></td><td>${r.date?new Date(r.date).toLocaleDateString('en-IN'):'—'}</td><td><button class="btn ghost small" onclick="returnDetails('${r.id}')">View</button></td></tr>`).join('')||`<tr><td colspan="8"><div class="empty">No return requests yet. Use “New return” to create one.</div></td></tr>`}
function openReturn(){const options=orders.slice().reverse().map(o=>`<option value="${attr(o.id)}">${esc(o.id)} · ${esc(o.name||'Customer')} · ${money(o.total)}</option>`).join('');openModal(`<div class="modal-head"><div><div class="label">RETURNS</div><h2>Create return request</h2></div><button class="close" onclick="closeModal()">✕</button></div>${orders.length?`<form onsubmit="saveReturn(event)"><div class="field"><label>Order</label><select id="rOrder" onchange="fillReturnOrder()">${options}</select></div><div class="field"><label>Reason</label><select id="rReason"><option>Size / fit issue</option><option>Wrong item received</option><option>Damaged item</option><option>Quality issue</option><option>Changed mind</option><option>Exchange requested</option><option>Other</option></select></div><div class="form-grid"><div class="field"><label>Refund amount</label><input id="rAmount" type="number" min="0"></div><div class="field"><label>Status</label><select id="rStatus">${['Requested','Approved','Pickup Scheduled','Received','Refunded','Rejected'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="field"><label>Internal note</label><textarea id="rNote" rows="4" placeholder="Pickup, exchange, refund reference, etc."></textarea></div><button class="btn" type="submit">Create return</button></form><script>setTimeout(fillReturnOrder,0)<\/script>`:'<div class="empty">No orders exist yet, so a return cannot be linked to an order.</div>'}`)}
function fillReturnOrder(){const o=orders.find(x=>x.id===document.getElementById('rOrder')?.value);const a=document.getElementById('rAmount');if(o&&a)a.value=Math.round(Number(o.total)||0)}
function saveReturn(e){e.preventDefault();const o=orders.find(x=>x.id===document.getElementById('rOrder').value);if(!o)return toast('Order not found');returnsDB.push({id:'RET-'+Date.now().toString().slice(-8),orderId:o.id,customer:o.name||'Customer',email:o.email||'',phone:o.phone||'',reason:document.getElementById('rReason').value,amount:Number(document.getElementById('rAmount').value)||0,status:document.getElementById('rStatus').value,note:document.getElementById('rNote').value.trim(),date:new Date().toISOString()});commit('Return request created');closeModal();show('returns')}
function setReturnStatus(id,status){const r=returnsDB.find(x=>x.id===id);if(!r)return;r.status=status;r.updatedAt=new Date().toISOString();commit('Return '+id+' updated');renderReturnsTable()}
function returnDetails(id){const r=returnsDB.find(x=>x.id===id);if(!r)return;openModal(`<div class="modal-head"><div><div class="label">${esc(r.id)}</div><h2>Return details</h2></div><button class="close" onclick="closeModal()">✕</button></div><div class="section-card"><h2>Order & customer</h2><div class="list-row"><div><b>${esc(r.orderId)}</b><small>${esc(r.customer)} · ${esc(r.email||'')}</small></div><strong>${money(r.amount)}</strong></div></div><div class="section-card"><h2>Request</h2><p><b>Reason:</b> ${esc(r.reason||'—')}</p><p><b>Status:</b> ${esc(r.status)}</p><p><b>Requested:</b> ${r.date?new Date(r.date).toLocaleString():'—'}</p><p><b>Internal note:</b> ${esc(r.note||'No note')}</p></div><div class="head-actions"><button class="btn danger" onclick="deleteReturn('${r.id}')">Delete return</button></div>`)}
function deleteReturn(id){if(!confirm('Delete this return record?'))return;returnsDB=returnsDB.filter(r=>r.id!==id);commit('Return record deleted');closeModal();show('returns')}
function exportReturns(){const rows=[['Return ID','Order ID','Customer','Email','Reason','Amount','Status','Requested','Note'],...returnsDB.map(r=>[r.id,r.orderId,r.customer,r.email,r.reason,r.amount,r.status,r.date,r.note])];downloadBlob('aehran-returns.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}

function catalogUploadsPage(){return `${head('Catalog Uploads','Add many products quickly with CSV/JSON, or create a catalogue item from a compact form.',`<button class="btn ghost" onclick="downloadCatalogTemplate()">Download CSV template</button>`)}<div class="grid2"><div class="section-card"><h2>Bulk catalog import</h2><p>Upload a CSV or JSON file. Matching SKU or product ID is updated; new rows are added.</p><div class="field"><label>Catalog file</label><input id="catalogFile" type="file" accept=".csv,.json,text/csv,application/json"></div><button class="btn" onclick="importCatalogFile()">Upload catalog</button><p class="mini-note">Required for a new product: name, price and image. Recommended columns: id, name, sku, audience, product_type, category, collections, price, old_price, stock, color, tag, tags, image, gallery, variant_group, gallery_type, color_variants, description.</p></div><div class="section-card"><h2>Import rules</h2><div class="list"><div class="list-row"><div><b>Update safely</b><small>Rows match existing items by ID first, then SKU.</small></div><span class="status Delivered">On</span></div><div class="list-row"><div><b>Collections</b><small>Separate multiple collection slugs with | or commas.</small></div></div><div class="list-row"><div><b>Gallery images</b><small>Separate image URLs with |.</small></div></div><div class="list-row"><div><b>Local Bridge</b><small>Imported products are saved to the same storefront key.</small></div><span class="status Delivered">Connected</span></div></div></div></div><div class="section-card"><h2>Quick product upload</h2><p>Create one product without opening the full product editor.</p><form onsubmit="quickCatalogSave(event)"><div class="form-grid"><div class="field"><label>Product name</label><input id="cuName" required placeholder="Ivory Wedding Kurta Set"></div><div class="field"><label>SKU</label><input id="cuSku" placeholder="AHR-IVORY-01"></div><div class="field"><label>Category</label><select id="cuCat">${COLLECTIONS.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select></div><div class="field"><label>Collections</label><input id="cuCollections" placeholder="new, men, wedding"></div><div class="field"><label>Price</label><input id="cuPrice" type="number" min="0" required></div><div class="field"><label>MRP / old price</label><input id="cuOld" type="number" min="0"></div><div class="field"><label>Stock</label><input id="cuStock" type="number" min="0" value="10"></div><div class="field"><label>Color</label><input id="cuColor" placeholder="Ivory"></div><div class="field wide"><label>Primary image URL</label><input id="cuImg" required placeholder="https://..."></div><div class="field wide"><label>Description</label><textarea id="cuDesc" rows="3"></textarea></div></div><button class="btn" type="submit">Publish product</button></form></div><div class="section-card"><h2>Catalog status</h2><div class="cards"><div class="stat"><label>Total products</label><strong>${products.length}</strong><small>Currently live in Local Bridge</small></div><div class="stat"><label>With stock</label><strong>${products.filter(p=>Number(p.stock)>0).length}</strong><small>Available products</small></div><div class="stat"><label>Out of stock</label><strong>${products.filter(p=>Number(p.stock)<=0).length}</strong><small>Need inventory update</small></div><div class="stat"><label>Collections</label><strong>${COLLECTIONS.length}</strong><small>Available catalog placements</small></div></div></div>`}
function quickCatalogSave(e){e.preventDefault();const cat=document.getElementById('cuCat').value,cols=parseMulti(document.getElementById('cuCollections').value);if(!cols.includes(cat))cols.push(cat);const name=document.getElementById('cuName').value.trim(),sku=document.getElementById('cuSku').value.trim()||'AHR-'+Date.now().toString().slice(-7),img=document.getElementById('cuImg').value.trim();const obj={id:slug(name)+'-'+Date.now().toString().slice(-5),name,sku,cat,collections:cols,price:Number(document.getElementById('cuPrice').value)||0,old:Number(document.getElementById('cuOld').value)||0,stock:Number(document.getElementById('cuStock').value)||0,color:document.getElementById('cuColor').value.trim(),tag:'New',rating:0,reviews:0,img,imgs:[img],desc:document.getElementById('cuDesc').value.trim()};products.unshift(obj);commit('Product published from Catalog Uploads');show('catalogUploads')}
function parseMulti(v){return [...new Set(String(v||'').split(/[|,]/).map(x=>slug(x)).filter(Boolean))]}
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>String(x).trim()!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>String(x).trim()!==''))rows.push(row);if(!rows.length)return[];const h=rows.shift().map(x=>String(x).trim().toLowerCase().replace(/\s+/g,'_'));return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??''])))}
function normalizeCatalogRow(r){const name=String(r.name||r.product_name||r.title||'').trim(),sku=String(r.sku||'').trim(),audience=slug(r.audience||'men')||'men',productType=slug(r.product_type||r.productType||'kurta-set')||'kurta-set',cat=slug(r.category||r.cat||'kurta')||'kurta',img=String(r.image||r.img||r.primary_image||'').trim(),id=slug(r.id||'')||slug(name);const collections=parseMulti(r.collections||r.collection||'');if(cat&&!collections.includes(cat))collections.push(cat);if(audience==='kids'&&!collections.includes('kids'))collections.push('kids');if(audience==='men'&&!collections.includes('men'))collections.push('men');if(productType.includes('jacket')){if(!collections.includes('jacket'))collections.push('jacket');const jc=audience==='kids'?'kids-jacket':'men-jacket';if(!collections.includes(jc))collections.push(jc)}if(audience==='kids'&&productType==='kurta-set'&&!collections.includes('kids-kurta'))collections.push('kids-kurta');const gallery=String(r.gallery||r.images||'').split('|').map(x=>x.trim()).filter(Boolean);if(img&&!gallery.includes(img))gallery.unshift(img);let colorVariants=[];try{colorVariants=typeof r.color_variants==='string'&&r.color_variants.trim()?JSON.parse(r.color_variants):[]}catch(e){}return {id:id||'product-'+Date.now()+Math.random().toString(36).slice(2,6),name,sku:sku||'AHR-'+Date.now().toString().slice(-7)+Math.random().toString(36).slice(2,4).toUpperCase(),audience,productType,cat,collections,price:Number(r.price||0),old:Number(r.old_price||r.old||r.mrp||0),stock:Number(r.stock||0),color:String(r.color||'').trim(),tag:String(r.tag||'New').trim()||'New',tags:parseMulti(r.tags||''),rating:Number(r.rating||0),reviews:Number(r.reviews||0),img,imgs:gallery.length?gallery:(img?[img]:[]),galleryType:String(r.gallery_type||r.galleryType||'multi-angle'),variantGroup:String(r.variant_group||r.variantGroup||''),colorVariants,desc:String(r.description||r.desc||'').trim()}}
function mergeCatalogRows(rows){let added=0,updated=0,skipped=0;rows.forEach(r=>{const obj=normalizeCatalogRow(r);if(!obj.name||!obj.img||!Number.isFinite(obj.price)){skipped++;return}let i=products.findIndex(p=>obj.id&&p.id===obj.id);if(i<0&&obj.sku)i=products.findIndex(p=>String(p.sku).toLowerCase()===obj.sku.toLowerCase());if(i>=0){products[i]={...products[i],...obj,id:products[i].id};updated++}else{products.unshift(obj);added++}});commit(`Catalog upload: ${added} added, ${updated} updated, ${skipped} skipped`);show('catalogUploads')}
function importCatalogFile(){const f=document.getElementById('catalogFile')?.files?.[0];if(!f)return toast('Choose a CSV or JSON catalog file');const rd=new FileReader();rd.onload=()=>{try{let rows=[];if(f.name.toLowerCase().endsWith('.json')){const d=JSON.parse(rd.result);rows=Array.isArray(d)?d:(Array.isArray(d.products)?d.products:[])}else rows=parseCSV(rd.result);if(!rows.length)return toast('No catalog rows found');mergeCatalogRows(rows)}catch(e){console.error(e);toast('Could not read this catalog file')}};rd.readAsText(f)}
function downloadCatalogTemplate(){const rows=[['id','name','sku','category','collections','price','old_price','stock','color','tag','image','gallery','description'],['ivory-kurta','Ivory Wedding Kurta Set','AHR-IVORY-01','kurta','new|men|wedding','4990','5990','12','Ivory','New','https://example.com/main.jpg','https://example.com/main.jpg|https://example.com/2.jpg','Premium festive kurta set']];downloadBlob('aehran-catalog-template.csv',rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}

function paymentsPage(){const valid=orders.filter(o=>o.status!=='Cancelled'),gross=valid.reduce((s,o)=>s+Number(o.total||0),0),refund=returnsDB.filter(r=>r.status==='Refunded').reduce((s,r)=>s+Number(r.amount||0),0),settled=valid.filter(o=>getSettlementStatus(o)==='Settled').reduce((s,o)=>s+paymentNet(o),0);return `${head('Payments','Track order payments, refunds and settlement status.',`<button class="btn ghost" onclick="exportPayments()">Export CSV</button>`)}<div class="cards"><div class="stat"><label>Gross collected</label><strong>${money(gross)}</strong><small>Non-cancelled orders</small></div><div class="stat"><label>Refunded</label><strong>${money(refund)}</strong><small>Returns marked Refunded</small></div><div class="stat"><label>Settled</label><strong>${money(settled)}</strong><small>Marked settled in admin</small></div><div class="stat"><label>Net payable</label><strong>${money(Math.max(0,gross-refund))}</strong><small>Gross minus refunds</small></div></div><div class="search-row" style="margin-top:16px"><input class="input" id="paymentSearch" placeholder="Search order, customer, method..." oninput="renderPaymentsTable()"><select id="paymentSettlement" onchange="renderPaymentsTable()"><option value="">All settlements</option>${['Pending','Settled','On Hold'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Method</th><th>Order status</th><th>Gross</th><th>Refund</th><th>Net</th><th>Settlement</th></tr></thead><tbody id="paymentsTbody"></tbody></table></div><div class="section-card" style="margin-top:16px"><h2>How this page works</h2><p>This build has no live payment gateway settlement API yet. Amounts come from AEHRAN orders and refunded return records; settlement status is an admin tracking field stored in Local Bridge.</p></div>`}
function returnRefundForOrder(id){return returnsDB.filter(r=>r.orderId===id&&r.status==='Refunded').reduce((s,r)=>s+Number(r.amount||0),0)}
function paymentNet(o){return Math.max(0,Number(o.total||0)-returnRefundForOrder(o.id))}
function getSettlementStatus(o){return paymentSettlements[o.id]||'Pending'}
function renderPaymentsTable(){const tb=document.getElementById('paymentsTbody');if(!tb)return;const q=(document.getElementById('paymentSearch')?.value||'').toLowerCase(),st=document.getElementById('paymentSettlement')?.value||'';const list=orders.slice().reverse().filter(o=>o.status!=='Cancelled').filter(o=>(!st||getSettlementStatus(o)===st)&&JSON.stringify(o).toLowerCase().includes(q));tb.innerHTML=list.map(o=>{const ref=returnRefundForOrder(o.id),ss=getSettlementStatus(o);return `<tr><td><b>${esc(o.id)}</b><br><small>${o.date?new Date(o.date).toLocaleDateString('en-IN'):'—'}</small></td><td>${esc(o.name||'—')}<br><small>${esc(o.email||'')}</small></td><td>${esc(o.payment||'—')}</td><td><span class="status ${esc(o.status)}">${esc(o.status)}</span></td><td>${money(o.total)}</td><td>${money(ref)}</td><td><b>${money(paymentNet(o))}</b></td><td><select onchange="setSettlementStatus('${o.id}',this.value)">${['Pending','Settled','On Hold'].map(x=>`<option ${x===ss?'selected':''}>${x}</option>`).join('')}</select></td></tr>`}).join('')||`<tr><td colspan="8"><div class="empty">No payment records yet.</div></td></tr>`}
function setSettlementStatus(id,status){paymentSettlements[id]=status;commit('Payment settlement '+id+' marked '+status);renderPaymentsTable()}
function exportPayments(){const rows=[['Order ID','Date','Customer','Email','Payment Method','Order Status','Gross','Refund','Net','Settlement'],...orders.filter(o=>o.status!=='Cancelled').map(o=>[o.id,o.date,o.name,o.email,o.payment,o.status,o.total,returnRefundForOrder(o.id),paymentNet(o),getSettlementStatus(o)])];downloadBlob('aehran-payments.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}

function shippingPage(){const c=cms.checkout;return `${head('Shipping & Payments','Control checkout labels and which payment methods customers can choose.',`<button class="btn" onclick="saveShipping()">Save settings</button>`)}<div class="grid2"><div class="section-card"><h2>Checkout</h2><div class="field"><label>Checkout title</label><input id="coTitle" value="${attr(c.title)}"></div><div class="field"><label>Shipping line</label><input id="coShip" value="${attr(c.shippingLabel)}"></div><div class="field"><label>Place order button</label><input id="coButton" value="${attr(c.orderButton)}"></div></div><div class="section-card"><h2>Payment methods</h2>${c.payments.map((x,i)=>`<div style="border-bottom:1px solid #eef0f2;padding:9px 0"><label class="check"><input id="payActive${i}" type="checkbox" ${x.active?'checked':''}> Enable ${esc(x.id)}</label><div class="field"><input id="payLabel${i}" value="${attr(x.label)}"></div><div class="field"><input id="payNote${i}" value="${attr(x.note)}"></div></div>`).join('')}</div></div>`}
function saveShipping(){cms.checkout.title=document.getElementById('coTitle').value;cms.checkout.shippingLabel=document.getElementById('coShip').value;cms.checkout.orderButton=document.getElementById('coButton').value;cms.checkout.payments.forEach((x,i)=>{x.active=document.getElementById('payActive'+i).checked;x.label=document.getElementById('payLabel'+i).value;x.note=document.getElementById('payNote'+i).value});commit('Checkout settings updated')}
function policiesPage(){return `${head('Policies','Edit the policy content shown from the storefront menu.',`<button class="btn" onclick="savePolicies()">Save policies</button>`)}${[['shipping','Shipping & Delivery'],['returns','Returns & Exchanges'],['privacy','Privacy Policy'],['terms','Terms & Conditions'],['size','Size Guide']].map(x=>`<div class="section-card"><h2>${x[1]}</h2><textarea class="input" id="policy_${x[0]}" rows="5">${esc(cms.policies[x[0]])}</textarea></div>`).join('')}`}
function savePolicies(){Object.keys(cms.policies).forEach(k=>cms.policies[k]=document.getElementById('policy_'+k).value);commit('Policies updated')}
function footerPage(){const f=cms.footer,s=cms.seo;return `${head('SEO & Footer','Control search metadata, newsletter copy and footer brand information.',`<button class="btn" onclick="saveFooter()">Save footer & SEO</button>`)}<div class="grid2"><div class="section-card"><h2>SEO</h2><div class="field"><label>Page title</label><input id="seoTitle" value="${attr(s.title)}"></div><div class="field"><label>Meta description</label><textarea id="seoDesc" rows="4">${esc(s.description)}</textarea></div></div><div class="section-card"><h2>Newsletter</h2><div class="field"><label>Heading</label><input id="footNewsTitle" value="${attr(f.newsletterTitle)}"></div><div class="field"><label>Text</label><textarea id="footNewsText">${esc(f.newsletterText)}</textarea></div></div></div><div class="section-card"><h2>Footer content</h2><div class="form-grid"><div class="field wide"><label>Brand about</label><textarea id="footAbout" rows="4">${esc(f.about)}</textarea></div><div class="field"><label>Contact email</label><input id="footEmail" value="${attr(f.contactEmail)}"></div><div class="field"><label>Instagram</label><input id="footIg" value="${attr(f.instagram)}"></div><div class="field wide"><label>Copyright</label><input id="footCopy" value="${attr(f.copyright)}"></div></div></div>`}
function saveFooter(){cms.seo.title=document.getElementById('seoTitle').value;cms.seo.description=document.getElementById('seoDesc').value;cms.footer.newsletterTitle=document.getElementById('footNewsTitle').value;cms.footer.newsletterText=document.getElementById('footNewsText').value;cms.footer.about=document.getElementById('footAbout').value;cms.footer.contactEmail=document.getElementById('footEmail').value;cms.footer.instagram=document.getElementById('footIg').value;cms.footer.copyright=document.getElementById('footCopy').value;commit('Footer and SEO updated')}
function backendPage(){return `${head('Local Sync','Use the built-in same-domain bridge without any cloud SDK.')}<div class="grid2"><div class="section-card"><h2>AEHRAN Local Bridge</h2><p>Products, banners, homepage copy, navigation, orders, returns and store settings use the same AEHRAN browser storage keys and BroadcastChannel.</p><div class="list-row"><div><b>Admin ↔ Storefront</b><small>Works when index.html and admin.html are hosted on the same domain/origin and opened in the same browser profile.</small></div><span class="status Delivered">Ready</span></div><div class="backend-note" style="margin-top:12px">No cloud SDK is included in this build. Cross-device syncing can be connected later when you decide which backend to use.</div></div><div class="section-card"><h2>Data controlled from Admin</h2><div class="collection-grid">${['Products & stock','Kids / Men / Jackets / Wedding categories','Hero banners','Homepage & Trending copy','Navigation','Branding & theme','Orders & labels','Returns / refunds','Payments tracking','Policies','SEO & footer'].map(x=>`<div class="collection-card"><b>${x}</b><small>AEHRAN local store data</small></div>`).join('')}</div></div></div>`}
function backupPage(){const size=(JSON.stringify({products,orders,reviewsDB,cms,media}).length/1024).toFixed(1);return `${head('Backup & Local Sync','Export or restore your store data and see the current local connection mode.')}<div class="grid2"><div class="section-card"><h2>AEHRAN Local Bridge</h2><p>Current data size: ${size} KB</p><div class="head-actions"><button class="btn" onclick="exportBackup()">Download full backup</button><label class="btn ghost">Import backup<input hidden type="file" accept="application/json" onchange="importBackup(this)"></label></div><p class="mini-note">Storefront and admin share AEHRAN browser-storage keys. Keep both files on the same domain/origin for local live control.</p></div><div class="section-card"><h2>Connection status</h2><div class="list-row"><div><b>Local Bridge</b><small>Products, orders, CMS, reviews, labels and media</small></div><span class="status Delivered">Ready</span></div><div class="list-row"><div><b>Cloud backend</b><small>Not included in this build</small></div><span class="status">Off</span></div></div></div><div class="section-card"><h2>Recent admin activity</h2><div class="list">${audit.slice(0,20).map(a=>`<div class="list-row"><div><b>${esc(a.msg)}</b><small>${new Date(a.time).toLocaleString()}</small></div></div>`).join('')||'<div class="empty">No admin changes yet.</div>'}</div></div><div class="section-card danger-zone"><h2>Reset demo store</h2><p>Restores seed products and default CMS. Existing orders are kept unless you choose the full reset.</p><div class="head-actions"><button class="btn danger" onclick="resetCatalogue()">Reset catalogue & CMS</button><button class="btn danger" onclick="fullReset()">Full reset including orders</button></div></div>`}
function exportBackup(){const data={version:2,exportedAt:new Date().toISOString(),aehran_products:products,aehran_orders:orders,aehran_reviews:reviewsDB,aehran_cms:cms,aehran_media:media,aehran_returns:returnsDB,aehran_payment_settlements:paymentSettlements};downloadBlob('aehran-full-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(data,null,2),'application/json')}
function importBackup(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);products=d.aehran_products||products;orders=d.aehran_orders||orders;reviewsDB=d.aehran_reviews||reviewsDB;cms=d.aehran_cms||cms;media=d.aehran_media||media;returnsDB=d.aehran_returns||returnsDB;paymentSettlements=d.aehran_payment_settlements||paymentSettlements;commit('Backup imported');show('dashboard')}catch(e){toast('Invalid AEHRAN backup file')}};r.readAsText(f)}
function resetCatalogue(){if(!confirm('Reset products and CMS to the AEHRAN demo defaults?'))return;products=clone(SEED_PRODUCTS);cms=clone(DEFAULT_CMS);commit('Catalogue and CMS reset');show('dashboard')}
function fullReset(){if(!confirm('This will also delete all local orders, reviews, returns and payment settlement records. Continue?'))return;products=clone(SEED_PRODUCTS);orders=[];reviewsDB={};cms=clone(DEFAULT_CMS);media=[];returnsDB=[];paymentSettlements={};commit('Full demo store reset');show('dashboard')}
function downloadBlob(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function openStorefront(){let url=localStorage.getItem('aehran_storefront_url');if(!url){url=prompt('Storefront URL or relative path','../AEHRAN-Final/index.html')||'';if(url)localStorage.setItem('aehran_storefront_url',url)}if(url)window.open(url,'_blank')}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalWrap').classList.add('open')}
function closeModal(){document.getElementById('modalWrap').classList.remove('open')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove('show'),2200)}
window.addEventListener('storage',e=>{if(['aehran_orders','aehran_products','aehran_reviews','aehran_returns','aehran_payment_settlements','aehran_cms','aehran_media'].includes(e.key)&&sessionStorage.getItem('aehran_admin_panel')==='1'){products=load('aehran_products',SEED_PRODUCTS);orders=load('aehran_orders',[]);ensureOrderLabels();reviewsDB=load('aehran_reviews',{});returnsDB=load('aehran_returns',[]);paymentSettlements=load('aehran_payment_settlements',{});cms=load('aehran_cms',DEFAULT_CMS);media=load('aehran_media',[]);if(['dashboard','orders','returns','payments','products','categoryControl','banners','homepage','navigation','display'].includes(current))show(current)}});
renderApp();
</script>

<script id="aehran-firebase-admin-bridge-classic">
(function(){
 window.AEHRAN_ADMIN_BRIDGE={snapshot(){return {products,orders,reviews:reviewsDB,cms,media,returns:returnsDB,paymentSettlements}},applyRemote(d={}){window.__aehranApplyingRemote=true;try{if(Array.isArray(d.products)){products=d.products;save('aehran_products',products)}if(Array.isArray(d.orders)){orders=d.orders;ensureOrderLabels();save('aehran_orders',orders)}if(d.reviews&&typeof d.reviews==='object'){reviewsDB=d.reviews;save('aehran_reviews',reviewsDB)}if(d.cms&&typeof d.cms==='object'){cms=d.cms;save('aehran_cms',cms)}if(Array.isArray(d.media)){media=d.media;save('aehran_media',media)}if(Array.isArray(d.returns)){returnsDB=d.returns;save('aehran_returns',returnsDB)}if(d.paymentSettlements&&typeof d.paymentSettlements==='object'){paymentSettlements=d.paymentSettlements;save('aehran_payment_settlements',paymentSettlements)}const e=document.getElementById('syncText');if(e)e.textContent='Firebase Live';if(sessionStorage.getItem('aehran_admin_panel')==='1'&&document.getElementById('content')){try{show(current)}catch(e){}}}finally{window.__aehranApplyingRemote=false}}};
 if(typeof commit==='function'&&!commit.__fbWrapped){const old=commit;commit=function(msg='Changes saved'){old(msg);if(!window.__aehranApplyingRemote){const e=document.getElementById('syncText');if(e)e.textContent='Syncing Firebase…';window.__aehranFirebaseAdminSave?.(window.AEHRAN_ADMIN_BRIDGE.snapshot())}};commit.__fbWrapped=true}
 const ctl=['Products & stock','Product photos & multi-angle galleries','Kids / Men / Jackets / Wedding categories','Hero banners & slider timing','Homepage / Trending / editorial text','Navigation','Logo / branding / theme','Checkout & payment labels','Orders & shipping labels','Returns / refunds','Reviews','Policies','SEO & footer','Media library'];
 backendPage=function(){return `${head('Firebase Realtime Sync','Admin changes are synced to the AEHRAN customer website in real time.')}<div class="grid2"><div class="section-card"><h2>Firebase connection</h2><div class="list-row"><div><b>Realtime Database</b><small>aehran-web · /aehran_store_v3</small></div><span class="status Delivered" id="firebaseAdminBadge">Connecting…</span></div><div class="list-row"><div><b>Firebase Storage</b><small>Uploaded product/banner/logo images are converted to cloud URLs when possible.</small></div><span class="status Delivered">Enabled</span></div><p class="mini-note">Database stores catalog, content, orders and settings. Storage holds uploaded image files and the database stores their URLs.</p><div class="head-actions"><button class="btn" onclick="window.__aehranFirebaseAdminSave?.(window.AEHRAN_ADMIN_BRIDGE.snapshot())">Push current admin data</button><button class="btn ghost" onclick="window.__aehranFirebaseAdminReload?.()">Reload from Firebase</button></div></div><div class="section-card"><h2>A–Z cloud control</h2><div class="collection-grid">${ctl.map(x=>`<div class="collection-card"><b>${x}</b><small>Realtime sync</small></div>`).join('')}</div></div></div>`}
})();
</script>

<script type="module" id="aehran-firebase-admin-module">
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getAnalytics,isSupported as analyticsSupported} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-analytics.js";
import {getDatabase,ref,get,set,onValue} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
import {getStorage,ref as storageRef,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-storage.js";
const firebaseConfig={apiKey:"AIzaSyBBKbbBGbRS7Y6MGxs2YT7AjwudJR4-lUE",authDomain:"aehran-web.firebaseapp.com",databaseURL:"https://aehran-web-default-rtdb.firebaseio.com",projectId:"aehran-web",storageBucket:"aehran-web.firebasestorage.app",messagingSenderId:"687593314969",appId:"1:687593314969:web:8e667d70ca9647069db608",measurementId:"G-MK42DZ2M6C"},ROOT='aehran_store_v3',app=getApps().length?getApp():initializeApp(firebaseConfig);try{if(await analyticsSupported())getAnalytics(app)}catch(e){}const db=getDatabase(app),storage=getStorage(app);
const arr=v=>Array.isArray(v)?v.filter(Boolean):(v&&typeof v==='object'?Object.values(v).filter(Boolean):[]),safe=s=>String(s).replace(/[.#$\[\]/]/g,'_'),map=a=>Object.fromEntries((a||[]).filter(Boolean).map((x,i)=>[safe(x.id||x.labelId||x.url||('row_'+i)),x]));
const status=t=>{const e=document.getElementById('syncText');if(e)e.textContent=t;const b=document.getElementById('firebaseAdminBadge');if(b)b.textContent=t};
function hash(s){let h=2166136261>>>0,st=Math.max(1,Math.floor(s.length/4000));for(let i=0;i<s.length;i+=st){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(36)+'_'+s.length.toString(36)}
async function img(data){if(typeof data!=='string'||!data.startsWith('data:image/'))return data;const k=hash(data),ck='aehran_fb_media_'+k,c=localStorage.getItem(ck);if(c)return c;try{status('Uploading images…');const m=data.match(/^data:(image\/[a-zA-Z0-9.+-]+);base64,/),mime=m?m[1]:'image/jpeg',ext=mime.includes('png')?'png':mime.includes('webp')?'webp':'jpg',blob=await(await fetch(data)).blob(),r=storageRef(storage,`aehran-v3/media/${k}.${ext}`);await uploadBytes(r,blob,{contentType:mime,cacheControl:'public,max-age=31536000'});const u=await getDownloadURL(r);localStorage.setItem(ck,u);return u}catch(e){console.warn('Image Storage fallback',e);return data}}
async function cloud(v){if(typeof v==='string')return v.startsWith('data:image/')?await img(v):v;if(Array.isArray(v)){const o=[];for(const x of v)o.push(await cloud(x));return o}if(v&&typeof v==='object'){const o={};for(const [k,x] of Object.entries(v))o[k]=await cloud(x);return o}return v}
async function pack(s){const c=await cloud(s);return {meta:{schemaVersion:3,brand:'AEHRAN',updatedAt:Date.now()},products:map(c.products),orders:map(c.orders),reviews:c.reviews||{},cms:c.cms||{},media:c.media||[],returns:map(c.returns),paymentSettlements:c.paymentSettlements||{}}}
const unpack=v=>({products:arr(v?.products),orders:arr(v?.orders).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))),reviews:v?.reviews||{},cms:v?.cms||{},media:Array.isArray(v?.media)?v.media:arr(v?.media),returns:arr(v?.returns),paymentSettlements:v?.paymentSettlements||{}});
async function saveAll(s){try{status('Syncing Firebase…');await set(ref(db,ROOT),await pack(s));status('Firebase Live')}catch(e){console.error(e);status('Firebase error');try{toast('Firebase save failed')}catch(_){}}}
window.__aehranFirebaseAdminSave=saveAll;window.__aehranFirebaseAdminReload=async()=>{try{status('Loading Firebase…');const s=await get(ref(db,ROOT));if(s.exists())window.AEHRAN_ADMIN_BRIDGE?.applyRemote(unpack(s.val()));status('Firebase Live')}catch(e){status('Firebase error')}};
try{const b=window.AEHRAN_ADMIN_BRIDGE,s=await get(ref(db,ROOT));if(!s.exists()||Number(s.val()?.meta?.schemaVersion||0)<3)await saveAll(b.snapshot());else b.applyRemote(unpack(s.val()));onValue(ref(db,ROOT),x=>{if(x.exists())b.applyRemote(unpack(x.val()))},()=>status('Firebase blocked'));status('Firebase Live');console.log('AEHRAN Firebase admin connected')}catch(e){console.error(e);status('Firebase blocked')}
</script>
